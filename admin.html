<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Fashion BD Admin</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🔐 Smart Fashion BD Adin Panel</h1>

<div class="card">

<h2>➕ নতুন পণ্য যোগ করুন</h2>

<input type="text" id="name" placeholder="পণ্যের নাম">

<br><br>

<input type="number" id="price" placeholder="দাম">

<br><br>

<select id="category">

<option>পুরুষদের পোশাক</option>

<option>মহিলাদের পোশাক</option>

<option>বাচ্চাদের পোশাক</option>

<option>টি-শার্ট</option>

<option>শার্ট</option>

<option>পাঞ্জাবি</option>

</select>

<br><br>

<input type="file">

<br><br>
<button class="btn" id="publishBtn" onclick="publishProduct()">
📤 Publish Product
</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
const supabaseUrl = "https://mxiqonrtzhmqnunddrkj.supabase.co";
const supabaseKey = "sb_publishable_ZyPvH2HEd8eMrZ9v1qwZCg_HhuaH-NW";

const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

async function publishProduct() {

  const name = document.getElementById("name").value;
  const price = document.getElementById("price").value;
  const category = document.getElementById("category").value;

  const file = document.querySelector('input[type="file"]').files[0];

  if (!file) {
    alert("ছবি নির্বাচন করুন");
    return;
  }

  const fileName = Date.now() + "-" + file.name;

  const { error: uploadError } = await supabase.storage
    .from("products")
    .upload(fileName, file);

  if (uploadError) {
    alert(uploadError.message);
    return;
  }

  const image =
    supabaseUrl +
    "/storage/v1/object/public/products/" +
    fileName;

  const { error } = await supabase
    .from("products")
    .insert([
      {
        name: name,
        price: Number(price),
        category: category,
        image: image
      }
    ]);

  if (error) {
    alert(error.message);
    return;
  }

  alert("✅ Product Published Successfully!");

  location.reload();
}
</script>
<script>
alert("JavaScript চলছে");
</script>
</body>
</html>
