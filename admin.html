<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Fashion BD Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f5f5;
padding:20px;
}

.card{
background:#fff;
padding:20px;
border-radius:10px;
max-width:450px;
margin:auto;
box-shadow:0 0 10px rgba(0,0,0,.15);
}

input,select{
width:100%;
padding:10px;
margin:8px 0;
}

button{
width:100%;
padding:12px;
background:#ff9800;
color:white;
border:none;
border-radius:6px;
font-size:18px;
cursor:pointer;
}
</style>

</head>

<body>

<div class="card">

<h2>➕ নতুন পণ্য যোগ করুন</h2>

<input id="name" placeholder="পণ্যের নাম">

<input id="price" type="number" placeholder="দাম">

<select id="category">
<option>পুরুষদের পোশাক</option>
<option>মহিলাদের পোশাক</option>
<option>বাচ্চাদের পোশাক</option>
<option>টি-শার্ট</option>
<option>শার্ট</option>
<option>পাঞ্জাবি</option>
</select>

<input id="image" type="file">

<button onclick="publishProduct()">
📤 Publish Product
</button>

</div><script>
const supabaseUrl = "https://mxiqonrtzhmqnunddrkj.supabase.co";
const supabaseKey = "sb_publishable_ZyPvH2HEd8eMrZ9v1qwZCg_HhuaH-NW";

const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

async function publishProduct(){

const name=document.getElementById("name").value;
const price=document.getElementById("price").value;
const category=document.getElementById("category").value;

const {error}=await supabase
.from("products")
.insert([{
name:name,
price:Number(price),
category:category
}]);

if(error){
alert("❌ "+error.message);
console.log(error);
return;
}

alert("✅ Product Published Successfully!");

}
</script>

</body>
</html>
