<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Fashion BD Admin</title>

<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="script.js"></script>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f5f5;
padding:20px;
}
.card{
max-width:500px;
margin:auto;
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.2);
}
input,select{
width:100%;
padding:10px;
margin:10px 0;
box-sizing:border-box;
}
button{
width:100%;
padding:12px;
background:#ff5722;
color:#fff;
border:none;
border-radius:5px;
font-size:18px;
cursor:pointer;
}
</style>

</head>

<body>

<div class="card">

<h2>Smart Fashion BD Admin</h2>

<form id="productForm">

<input id="name" type="text" placeholder="পণ্যের নাম" required>

<input id="price" type="number" placeholder="দাম" required>

<select id="category">
<option>পুরুষদের পোশাক</option>
<option>মহিলাদের পোশাক</option>
<option>বাচ্চাদের পোশাক</option>
<option>টি-শার্ট</option>
<option>শার্ট</option>
<option>পাঞ্জাবি</option>
</select>

<input id="image" type="text" placeholder="ছবির URL">

<button type="submit">
📤 Publish Product
</button>

</form><script>
document.getElementById("productForm").addEventListener("submit", function(e){
    e.preventDefault();
    publishProduct();
});
</script>

</body>
</html>

</div>
