<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMART FASHION BD Admin Panel</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
display:flex;
background:#f4f4f4;
}

.sidebar{
width:240px;
height:100vh;
background:#ff6b00;
color:#fff;
padding:20px;
position:fixed;
left:0;
top:0;
}

.sidebar h2{
margin-bottom:30px;
text-align:center;
}

.sidebar a{
display:block;
color:#fff;
text-decoration:none;
padding:12px;
margin:8px 0;
border-radius:6px;
}

.sidebar a:hover{
background:rgba(255,255,255,.2);
}

.main{
margin-left:240px;
width:100%;
padding:20px;
}

.header{
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
margin-bottom:20px;
}

.cards{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
}

.card{
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
text-align:center;
}

.card h3{
font-size:30px;
color:#ff6b00;
}
</style>
</head>

<body>

<div class="sidebar">

<h2>SMART FASHION BD</h2>

<a href="#">🏠 Dashboard</a>
<a href="#">📦 Products</a>
<a href="#">🛒 Orders</a>
<a href="#">👥 Resellers</a>
<a href="#">⚙ Settings</a>

</div>

<div class="main">

<div class="header">
<h2>Admin Dashboard</h2>
<p>Welcome Admin</p>
</div>

<div class="cards">

<div class="card">
<h3>0</h3>
<p>Total Products</p>
</div>

<div class="card">
<h3>0</h3>
<p>Total Orders</p>
</div>

<div class="card">
<h3>0</h3>
<p>Total Resellers</p>
</div>

</div><div class="card" style="margin-top:20px;text-align:left;grid-column:1/4;">
<form id="productForm">
<h2>➕ Add New Product</h2>

<input type="text" id="name" placeholder="পণ্যের নাম"
style="width:100%;padding:12px;margin-top:15px;">

<input type="number" id="price" placeholder="দাম"
style="width:100%;padding:12px;margin-top:10px;">

<select id="category"
style="width:100%;padding:12px;margin-top:10px;">

<option>পুরুষদের পোশাক</option>
<option>মহিলাদের পোশাক</option>
<option>বাচ্চাদের পোশাক</option>
<option>টি-শার্ট</option>
<option>শার্ট</option>
<option>পাঞ্জাবি</option>

</select><textarea id="description"
placeholder="পণ্যের বিস্তারিত বিবরণ লিখুন..."
style="width:100%;padding:12px;margin-top:10px;height:120px;"></textarea>

<input type="file"
id="image"
accept="image/*"
style="width:100%;padding:12px;margin-top:10px;">

<button id="publishBtn"
style="width:100%;padding:14px;background:#ff6b00;color:#fff;border:none;border-radius:8px;font-size:18px;margin-top:15px;cursor:pointer;">

📤 Publish Product

</button>
</form>

  </div></div>

</body>
</html>
